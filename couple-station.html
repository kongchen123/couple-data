<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>情侣小站 · 单页版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { height: 100vh; height: 100dvh; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(180deg, #ffe4ec 0%, #fff7f9 240px) #fff7f9; color: #4a3b40; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none; }
header { flex: none; padding: 16px 20px 6px; display: flex; align-items: center; gap: 10px; max-width: 560px; width: 100%; margin: 0 auto; }
header .logo { font-size: 26px; }
header h1 { font-size: 19px; font-weight: 700; letter-spacing: 1px; color: #4a3b40; }
header .sub { font-size: 12px; color: #a08a92; margin-top: 2px; }
main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 4px 14px 10px; max-width: 560px; width: 100%; margin: 0 auto; }
.hero { background: linear-gradient(135deg, #ff8fa8 0%, #f5577f 60%, #e9407a 100%); color: #fff; border-radius: 22px; padding: 18px 20px 16px; text-align: center; box-shadow: 0 10px 30px rgba(245,87,127,.35); margin-bottom: 10px; position: relative; overflow: hidden; }
.hero::before, .hero::after { content: "♥"; position: absolute; font-size: 90px; opacity: .12; }
.hero::before { top: -18px; left: -14px; }
.hero::after { bottom: -26px; right: -10px; font-size: 120px; }
.hero .names { font-size: 16px; opacity: .95; }
.hero .days { font-size: 44px; font-weight: 800; line-height: 1.12; margin: 4px 0 3px; }
.hero .days small { font-size: 16px; font-weight: 600; margin-left: 4px; }
.hero .since { font-size: 12.5px; opacity: .85; }
.card { background: #fff; border-radius: 18px; box-shadow: 0 6px 24px rgba(245,87,127,.1); padding: 13px 14px; margin-bottom: 10px; }
.card h2 { font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.page { display: none; }
/* 页面骨架：整页不滚，顶部固定 + 下方局部滚动 */
.page.active { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
/* 左右滑动切页的入场动画 */
@keyframes pageInL { from { transform: translateX(32px); opacity: .5; } }
@keyframes pageInR { from { transform: translateX(-32px); opacity: .5; } }
.page.active.anim-l { animation: pageInL .26s cubic-bezier(.22,.9,.32,1); }
.page.active.anim-r { animation: pageInR .26s cubic-bezier(.22,.9,.32,1); }
.page.active > * { flex-shrink: 0; }
.page.active > .scroll-area { flex: 1 1 auto; min-height: 0; flex-shrink: 1; }
.scroll-area { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 4px; }
.scroll-area::-webkit-scrollbar { width: 4px; }
.scroll-area::-webkit-scrollbar-thumb { background: #f0c9d4; border-radius: 2px; }
/* 首页/设置页内容本身较长，允许页内整体滚动（body 仍不滚） */
#page-home.active, #page-settings.active { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; }
/* 值得期待的日子：每页最多 4 个（两行），超过滑动翻页 */
.count-pager { overflow: hidden; touch-action: pan-y; }
.count-track { display: flex; width: 100%; align-items: flex-start; transition: transform .28s ease, height .25s ease; will-change: transform; }
.count-page { flex: 0 0 100%; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
.count-page .empty { grid-column: 1 / -1; }
.count-dots { display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: 9px; }
.count-dots:empty { display: none; }
.count-dots i { width: 5px; height: 5px; border-radius: 3px; background: #ffd0dc; transition: all .2s; cursor: pointer; }
.count-dots i.on { width: 14px; background: #e9407a; }
.count-item { min-width: 0; background: #fff5f7; border-radius: 12px; padding: 8px 12px; }
.count-item .date { word-break: break-word; overflow-wrap: anywhere; font-size: 11px; color: #c9b3bb; line-height: 1.5; }
.count-item .date .ymd { white-space: nowrap; }
/* 短屏压缩，尽量让首页不出现滚动 */
@media (max-height: 760px) {
  header { padding: 6px 20px 3px; }
  header .logo { font-size: 21px; }
  header h1 { font-size: 16px; }
  header .sub { font-size: 11px; }
  .hero { padding: 11px 14px 9px; margin-bottom: 7px; border-radius: 16px; }
  .hero .names { font-size: 14.5px; }
  .hero .days { font-size: 34px; margin: 2px 0 2px; }
  .hero .since { font-size: 11px; }
  .card { padding: 10px 11px; margin-bottom: 7px; }
  .card h2 { margin-bottom: 7px; font-size: 13.5px; }
  .count-pager { min-height: 0; }
  .count-item { padding: 6px 9px; }
  .count-item .num { font-size: 15px; }
  .quote { font-size: 12.5px; line-height: 1.6; }
  .hero .lunar-today { display: none; }
}
.count-item .label { font-size: 12px; color: #a08a92; }
.count-item .num { font-size: 16px; font-weight: 700; color: #e9407a; margin-top: 2px; }
.quote { font-size: 13px; color: #8a6e78; line-height: 1.7; font-style: italic; }
.quote-refresh { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; border: 1px solid #f3d6de; background: #fff6f8; color: #e9407a; font-size: 15px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s; }
.quote-refresh:active { background: #ffe4ec; }
.quote-refresh.loading { animation: qspin .8s linear infinite; }
@keyframes qspin { to { transform: rotate(360deg); } }
.progress-bar { height: 10px; background: #ffe3ea; border-radius: 6px; overflow: hidden; margin-top: 8px; }
.progress-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff8fa8, #e9407a); border-radius: 6px; transition: width .3s; }
.composer textarea { width: 100%; min-height: 80px; border: 1.5px solid #f3dee4; border-radius: 12px; padding: 10px 12px; font-size: 14px; font-family: inherit; resize: vertical; outline: none; background: #fffdfa; }
.composer textarea:focus { border-color: #ff7e9d; }
.composer-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.composer-row input[type="date"] { flex: 1 1 120px; min-width: 0; }
.inline-composer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.inline-composer input[type="text"] { flex: 1 1 140px; }
.inline-composer input[type="date"] { flex: 1 1 110px; }
input[type="date"], input[type="text"], input[type="password"] { border: 1.5px solid #f3dee4; border-radius: 10px; padding: 8px 10px; font-size: 13px; color: #4a3b40; background: #fff; outline: none; min-width: 0; max-width: 100%; }
input:focus { border-color: #ff7e9d; }
.btn { border: none; border-radius: 12px; padding: 9px 16px; font-size: 14px; font-weight: 700; background: linear-gradient(135deg, #ff8fa8, #f5577f); color: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(245,87,127,.3); white-space: nowrap; flex-shrink: 0; }
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .5; }
.btn.ghost, .btn.danger { background: #fff; border: 1.5px solid #ffc9d6; box-shadow: none; }
.btn.ghost { color: #e9407a; }
.btn.small { padding: 6px 12px; font-size: 12px; }
.btn.danger { color: #e05070; padding: 4px 10px; font-size: 12px; }
.photo-preview { position: relative; margin-top: 10px; display: none; }
.photo-preview img { max-width: 120px; max-height: 120px; border-radius: 10px; border: 2px solid #ffd6e0; }
.photo-preview .x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: #e05070; color: #fff; border: none; font-size: 12px; cursor: pointer; }
.search-box { display: flex; gap: 8px; margin-bottom: 12px; }
.search-box input { flex: 1; }
/* ---- 时间线：左侧竖轴 + 圆点 + 作者徽标 ---- */
.tl-group { position: relative; padding-left: 18px; margin-bottom: 4px; }
.tl-group::before { content: ""; position: absolute; left: 4px; top: 36px; bottom: 14px; width: 2px; background: linear-gradient(180deg, #ffd9e2, #ffeef3); border-radius: 1px; }
.group-month { position: sticky; top: 0; z-index: 2; font-size: 13px; font-weight: 700; color: #e9407a; padding: 8px 0; display: flex; align-items: center; gap: 6px; background: linear-gradient(180deg, #fff7f9 85%, rgba(255,247,249,0)); margin-left: -18px; padding-left: 18px; }
.group-month::after { content: ""; flex: 1; height: 1px; background: #ffd6e0; }
.tl-item { position: relative; background: #fff; border-radius: 14px; padding: 11px 14px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(245,87,127,.08); }
.tl-item::before { content: ""; position: absolute; left: -17px; top: 17px; width: 8px; height: 8px; border-radius: 50%; background: #ff8fa8; box-shadow: 0 0 0 3px #ffe4ec; }
.tl-item.who2::before { background: #8f7ff5; box-shadow: 0 0 0 3px #e9e5ff; }
.tl-item .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; padding-right: 16px; }
.tl-item .who { font-size: 11.5px; font-weight: 700; color: #e9407a; background: #ffeef3; border-radius: 8px; padding: 2px 9px; }
.tl-item.who2 .who { color: #6f63d8; background: #efedff; }
.tl-item .when { font-size: 11px; color: #c9b3bb; flex-shrink: 0; }
.tl-item .text { font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
.tl-link, .capsule-item .tl-link { color: #e9407a; text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }
.tl-link:active { opacity: .6; }
.tl-item img.photo { max-width: 100%; max-height: 220px; border-radius: 12px; margin-top: 8px; cursor: zoom-in; display: block; }
.tl-item .del { position: absolute; top: 8px; right: 8px; border: none; background: none; color: #e3bcc7; font-size: 14px; cursor: pointer; padding: 2px 4px; }
.empty { text-align: center; color: #c9b3bb; font-size: 13px; padding: 24px 0; line-height: 1.8; }
.x-del { border: none; background: none; color: #d9a3b1; cursor: pointer; }
.tag-picker, .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { padding: 5px 14px; border-radius: 20px; font-size: 12px; border: 1.5px solid #f3dee4; background: #fff; color: #8a6e78; cursor: pointer; }
.chip.on { background: #ff8fa8; border-color: #ff8fa8; color: #fff; font-weight: 700; }
.chip.tag-new { border-style: dashed; color: #c9a1ac; }
.chip.tag-new.on { background: #fff0f4; border-color: #ff8fa8; color: #e9407a; }
.chip .tag-x { display: inline-block; margin-left: 4px; padding: 0 2px; font-size: 13px; line-height: 1; opacity: .55; }
.chip .tag-x:hover { opacity: 1; }
.tag-editor { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.tag-editor input { flex: 1 1 140px; min-width: 0; border-radius: 12px; padding: 8px 12px; background: #fffdfa; }
.tag-editor input:focus { border-color: #ff8fa8; }
.wish-item { display: flex; align-items: center; gap: 10px; background: #fff5f7; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.wish-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #e9407a; flex-shrink: 0; }
.wish-item .text { flex: 1; font-size: 14px; line-height: 1.5; word-break: break-word; }
.wish-item.done .text { text-decoration: line-through; color: #c9b3bb; }
.wish-tag { font-size: 10px; background: #ffe3ea; color: #e9407a; border-radius: 8px; padding: 2px 8px; flex-shrink: 0; }
.capsule-item { position: relative; background: #fff5f7; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.capsule-item.locked { background: #f3eef5; }
.capsule-item .meta { font-size: 11px; color: #a08a92; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; padding-right: 20px; }
.capsule-item .text { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.badge { font-size: 10px; border-radius: 8px; padding: 2px 8px; font-weight: 700; }
.badge.lock { background: #efe3f5; color: #9a6ab8; }
.badge.open { background: #e2f7e9; color: #3aa864; }
.rec-panel { text-align: center; padding: 10px 0; }
.rec-btn { width: 74px; height: 74px; border-radius: 50%; border: none; background: linear-gradient(135deg, #ff8fa8, #f5577f); color: #fff; font-size: 26px; cursor: pointer; box-shadow: 0 6px 18px rgba(245,87,127,.35); }
.rec-btn.recording { background: #e05070; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.rec-tip { font-size: 12px; color: #a08a92; margin-top: 8px; }
.voice-item { display: flex; align-items: center; gap: 10px; background: #fff5f7; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow .2s, background .2s; }
.voice-item.playing { background: #fff0f4; box-shadow: inset 0 0 0 1.5px #ffc9d6; }
.voice-item .voice-msg { flex: 1; min-width: 0; }
.voice-item .voice-msg .who { font-size: 13px; font-weight: 700; }
.voice-item .voice-msg .sub { font-size: 11px; color: #a08a92; margin-top: 2px; }
.play-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: #e9407a; color: #fff; font-size: 14px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: transform .15s; }
.play-btn:active { transform: scale(.93); }
.play-btn.loading { background: #ffb3c6; }
.wave { display: flex; align-items: center; gap: 2px; height: 20px; }
.wave .bar { width: 3px; border-radius: 2px; background: #ff9fb5; animation: wave 0.9s ease-in-out infinite; }
@keyframes wave { 0%,100% { height: 5px; } 50% { height: 18px; } }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; color: #a08a92; margin-bottom: 4px; }
.field input { width: 100%; }
.day-item { display: flex; align-items: center; gap: 8px; background: #fff5f7; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; font-size: 13px; }
.day-item .d { margin-left: auto; color: #a08a92; font-size: 12px; }
/* ---- 经期记录 ---- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head .ym { font-size: 14px; font-weight: 700; color: #e9407a; }
.cal-head button { border: 1.5px solid #f3dee4; background: #fff; color: #e9407a; border-radius: 8px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-grid .wd { text-align: center; font-size: 11px; color: #c9b3bb; padding: 2px 0; }
.cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12.5px; color: #6b5560; border-radius: 50%; }
.cal-cell.dim { color: #e9d5da; }
.cal-cell.on { background: #ff8fa8; color: #fff; font-weight: 700; }
.cal-cell.pred { background: #ffe3ea; color: #e9407a; }
.cal-cell.today { box-shadow: inset 0 0 0 2px #e9407a; }
.cal-legend { display: flex; gap: 14px; font-size: 11px; color: #a08a92; margin-top: 8px; flex-wrap: wrap; }
.cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.period-item { display: flex; align-items: center; gap: 10px; background: #fff5f7; border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
.period-item .info { flex: 1; min-width: 0; }
.period-item .range { font-weight: 700; color: #e9407a; }
.period-item .sub { font-size: 11px; color: #a08a92; margin-top: 2px; }
.pred-card { background: linear-gradient(135deg, #fff0f4, #ffe3ea); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.pred-card .big { font-size: 15px; font-weight: 700; color: #e9407a; }
.pred-card .sub { font-size: 12px; color: #a08a92; margin-top: 4px; line-height: 1.6; }
.sync-state { font-size: 12px; color: #a08a92; margin-top: 8px; }
/* ---- 本地缓存卡片 ---- */
.cache-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: #f3f8f2; color: #5b8f5b; margin-bottom: 12px; }
.cache-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.cache-badge.busy { background: #fdf5e8; color: #b98a3a; }
.cache-badge.warn { background: #fdeff1; color: #c9707f; }
.cache-badge.idle { background: #f4f1f2; color: #9b8b92; }
.cache-rows { display: flex; flex-direction: column; gap: 2px; }
.cache-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; padding: 8px 0; border-bottom: 1px dashed rgba(214,176,186,.35); }
.cache-row:last-child { border-bottom: none; }
.cache-row .k { color: #9b8b92; flex: none; }
.cache-row .v { color: #6b5560; font-weight: 600; text-align: right; line-height: 1.45; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(74,59,64,.92); color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 20px; z-index: 99; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }
nav.tabbar { flex: none; background: #fff; display: flex; box-shadow: 0 -4px 16px rgba(245,87,127,.08); padding-bottom: env(safe-area-inset-bottom); max-width: 560px; width: 100%; margin: 0 auto; }
nav.tabbar button { flex: 1; border: none; background: none; padding: 9px 0 7px; font-size: 11px; color: #b9a1a9; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; }
nav.tabbar button .ico { font-size: 19px; }
nav.tabbar button.on { color: #e9407a; font-weight: 700; }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
#lightbox img { max-width: 94vw; max-height: 90vh; border-radius: 8px; }
/* 常驻语音播放器：视觉隐藏但始终留在文档中，保证 play() 不被中断 */
#voiceAudio { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.tips { font-size: 12px; color: #a08a92; margin-top: 10px; line-height: 1.6; }
.lunar-today { font-size: 12px; opacity: .85; margin-top: 5px; letter-spacing: .3px; }
</style>
</head>
<body>
<header>
  <div class="logo">💌</div>
  <div>
    <h1>情侣小站</h1>
    <div class="sub" id="hSub">我 和 TA 的专属空间</div>
  </div>
</header>

<main>
  <!-- ============ 首页 ============ -->
  <section class="page" id="page-home">
    <div class="hero">
      <div class="names" id="hTitle">我 ♥ TA</div>
      <div class="days"><span id="hDays">—</span><small>天</small></div>
      <div class="since" id="hSince">去「设置」里填上在一起的日子吧</div>
      <div class="lunar-today" id="hLunar">农历</div>
    </div>
    <div class="card">
      <h2>🎂 值得期待的日子</h2>
      <div class="count-pager" id="countPager"><div class="count-track" id="countList"></div></div>
      <div class="count-dots" id="countDots"></div>
    </div>
    <div class="card">
      <h2>🌸 今日情话
        <button class="quote-refresh" id="quoteBtn" onclick="refreshQuote()" title="换一句" aria-label="换一句情话">↻</button>
      </h2>
      <div class="quote" id="quote">正在为你取一句情话…</div>
    </div>
    <div class="card">
      <h2>💫 心愿进度</h2>
      <div style="display:flex; justify-content:space-between; font-size:13px;">
        <span>已完成 <b id="wishDone" style="color:#e9407a">0</b> / <span id="wishTotal">0</span></span>
        <b id="wishPercent" style="color:#e9407a">0%</b>
      </div>
      <div class="progress-bar"><i id="wishBar" style="width:0%"></i></div>
    </div>
  </section>

  <!-- ============ 时间线 ============ -->
  <section class="page active" id="page-timeline">
    <div class="card composer">
      <h2>📖 记录此刻</h2>
      <textarea id="tlText" placeholder="记录你们的点点滴滴…"></textarea>
      <div class="composer-row">
        <input type="date" id="tlDate">
        <label class="btn small ghost" style="display:inline-block">📷 照片<input type="file" id="tlPhoto" accept="image/*" hidden></label>
        <button class="btn small" id="tlAdd" onclick="addTimeline()">发布</button>
      </div>
      <div class="photo-preview" id="tlPreview"><img id="tlPreviewImg" alt=""><button class="x" onclick="clearPhoto()">✕</button></div>
    </div>
    <div class="search-box"><input type="text" id="tlSearch" placeholder="🔍 搜索记录内容或作者…"></div>
    <div class="scroll-area"><div id="tlList"></div></div>
  </section>

  <!-- ============ 心愿 ============ -->
  <section class="page" id="page-wishes">
    <div class="card">
      <h2>✨ 许个心愿</h2>
      <div class="composer inline-composer">

<!-- ======== 农历算法模块（已内联，原 lunar.js） ======== -->
<script>
'use strict';
/* =========================================================
 * 农历（阴历）工具库
 * 功能：公历 ⇄ 农历互转、农历中文名称、干支纪年、
 *       生日数据规范化、下一次农历生日推算
 * 支持范围：1900-01-31 ~ 2100-12-31
 * ========================================================= */

// 1900-2100 年农历数据表，每年一个 16 进制数：
// 低 4 位   = 闰月月份（0 表示当年无闰月）
// 第 17 位  = 闰月是否 30 天
// 第 4-15 位 = 正月至腊月是否 30 天
const LUNAR_INFO = [
  0x04bd8, 0x04ae0, 0x0a570, 0x054d5, 0x0d260, 0x0d950, 0x16554, 0x056a0, 0x09ad0, 0x055d2, // 1900-1909
  0x04ae0, 0x0a5b6, 0x0a4d0, 0x0d250, 0x1d255, 0x0b540, 0x0d6a0, 0x0ada2, 0x095b0, 0x14977, // 1910-1919
  0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970, // 1920-1929
  0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950, // 1930-1939
  0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x0b557, // 1940-1949
  0x06ca0, 0x0b550, 0x15355, 0x04da0, 0x0a5b0, 0x14573, 0x052b0, 0x0a9a8, 0x0e950, 0x06aa0, // 1950-1959
  0x0aea6, 0x0ab50, 0x04b60, 0x0aae4, 0x0a570, 0x05260, 0x0f263, 0x0d950, 0x05b57, 0x056a0, // 1960-1969
  0x096d0, 0x04dd5, 0x04ad0, 0x0a4d0, 0x0d4d4, 0x0d250, 0x0d558, 0x0b540, 0x0b6a0, 0x195a6, // 1970-1979
  0x095b0, 0x049b0, 0x0a974, 0x0a4b0, 0x0b27a, 0x06a50, 0x06d40, 0x0af46, 0x0ab60, 0x09570, // 1980-1989
  0x04af5, 0x04970, 0x064b0, 0x074a3, 0x0ea50, 0x06b58, 0x055c0, 0x0ab60, 0x096d5, 0x092e0, // 1990-1999
  0x0c960, 0x0d954, 0x0d4a0, 0x0da50, 0x07552, 0x056a0, 0x0abb7, 0x025d0, 0x092d0, 0x0cab5, // 2000-2009
  0x0a950, 0x0b4a0, 0x0baa4, 0x0ad50, 0x055d9, 0x04ba0, 0x0a5b0, 0x15176, 0x052b0, 0x0a930, // 2010-2019
  0x07954, 0x06aa0, 0x0ad50, 0x05b52, 0x04b60, 0x0a6e6, 0x0a4e0, 0x0d260, 0x0ea65, 0x0d530, // 2020-2029
  0x05aa0, 0x076a3, 0x096d0, 0x04afb, 0x04ad0, 0x0a4d0, 0x1d0b6, 0x0d250, 0x0d520, 0x0dd45, // 2030-2039
  0x0b5a0, 0x056d0, 0x055b2, 0x049b0, 0x0a577, 0x0a4b0, 0x0aa50, 0x1b255, 0x06d20, 0x0ada0, // 2040-2049
  0x14b63, 0x09370, 0x049f8, 0x04970, 0x064b0, 0x168a6, 0x0ea50, 0x06b20, 0x1a6c4, 0x0aae0, // 2050-2059
  0x0a2e0, 0x0d2e3, 0x0c960, 0x0d557, 0x0d4a0, 0x0da50, 0x05d55, 0x056a0, 0x0a6d0, 0x055d4, // 2060-2069
  0x052d0, 0x0a9b8, 0x0a950, 0x0b4a0, 0x0b6a6, 0x0ad50, 0x055a0, 0x0aba4, 0x0a5b0, 0x052b0, // 2070-2079
  0x0b273, 0x06930, 0x07337, 0x06aa0, 0x0ad50, 0x14b55, 0x04b60, 0x0a570, 0x054e4, 0x0d160, // 2080-2089
  0x0e968, 0x0d520, 0x0daa0, 0x16aa6, 0x056d0, 0x04ae0, 0x0a9d4, 0x0a2d0, 0x0d150, 0x0f252, // 2090-2099
  0x0d520 // 2100
];

const LUNAR_MONTH_CN = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
const GAN_CN = '甲乙丙丁戊己庚辛壬癸';
const ZHI_CN = '子丑寅卯辰巳午未申酉戌亥';

// 某农历年的闰月月份，0 表示无闰月
function lunarLeapMonth(y) {
  return LUNAR_INFO[y - 1900] & 0xf;
}

// 某农历年闰月的天数（无闰月返回 0）
function lunarLeapDays(y) {
  if (!lunarLeapMonth(y)) return 0;
  return (LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29;
}

// 某农历年第 m 个月（非闰月）的天数
function lunarMonthDays(y, m) {
  return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29;
}

// 某农历年的总天数
function lunarYearDays(y) {
  let sum = 348;
  for (let i = 0x8000; i > 0x8; i >>= 1) {
    sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
  }
  return sum + lunarLeapDays(y);
}

// 公历 Date → 农历 { year, month, day, isLeap }
function solarToLunar(date) {
  const sy = date.getFullYear();
  const sm = date.getMonth();
  const sd = date.getDate();
  if (sy < 1900 || sy > 2100) return null;
  let offset = Math.floor((Date.UTC(sy, sm, sd) - Date.UTC(1900, 0, 31)) / 86400000);
  if (offset < 0) return null;
  let i = 0;
  let temp = 0;
  for (i = 1900; i < 2101 && offset > 0; i++) {
    temp = lunarYearDays(i);
    offset -= temp;
  }
  if (offset < 0) {
    offset += temp;
    i--;
  }
  const year = i;
  const leap = lunarLeapMonth(year);
  let isLeap = false;
  for (i = 1; i < 13 && offset > 0; i++) {
    if (leap > 0 && i === leap + 1 && !isLeap) {
      --i;
      isLeap = true;
      temp = lunarLeapDays(year);
    } else {
      temp = lunarMonthDays(year, i);
    }
    if (isLeap && i === leap + 1) isLeap = false;
    offset -= temp;
  }
  if (offset === 0 && leap > 0 && i === leap + 1) {
    if (isLeap) {
      isLeap = false;
    } else {
      isLeap = true;
      --i;
    }
  }
  if (offset < 0) {
    offset += temp;
    --i;
  }
  return { year: year, month: i, day: offset + 1, isLeap: isLeap };
}

// 农历 → 公历 { y, m, d }；参数非法时返回 null
function lunarToSolar(y, m, d, isLeap) {
  if (y < 1900 || y > 2100) return null;
  if (m < 1 || m > 12 || d < 1) return null;
  const leap = lunarLeapMonth(y);
  if (isLeap && leap !== m) return null;
  const dim = isLeap ? lunarLeapDays(y) : lunarMonthDays(y, m);
  if (!dim || d > dim) return null;
  let offset = 0;
  for (let i = 1900; i < y; i++) offset += lunarYearDays(i);
  let leapAdded = false;
  for (let i = 1; i < m; i++) {
    if (!leapAdded && leap > 0 && leap <= i) {
      offset += lunarLeapDays(y);
      leapAdded = true;
    }
    offset += lunarMonthDays(y, i);
  }
  if (isLeap) offset += lunarMonthDays(y, m); // 闰月排在同名月之后
  offset += d - 1;
  const dt = new Date(Date.UTC(1900, 0, 31) + offset * 86400000);
  return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
}

// 农历月份名，如：正月 / 闰六月 / 腊月
function lunarMonthName(m, isLeap) {
  return (isLeap ? '闰' : '') + (LUNAR_MONTH_CN[m - 1] || '') + '月';
}

// 农历日期名，如：初一 / 十五 / 廿九 / 三十
function lunarDayName(d) {
  if (d < 1 || d > 30) return '';
  if (d === 10) return '初十';
  if (d === 20) return '二十';
  if (d === 30) return '三十';
  const tens = Math.floor(d / 10);
  const pre = tens === 0 ? '初' : (tens === 1 ? '十' : '廿');
  const digits = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  return pre + digits[(d % 10) - 1];
}

// 干支纪年，如：2026 → 丙午
function ganzhiYear(y) {
  return GAN_CN[(y - 4) % 10] + ZHI_CN[(y - 4) % 12];
}

// 生日是否被自动换算过（旧版本存的是公历日期字符串）
let bdAutoConverted = false;

// 生日数据统一为农历对象 { m: 月, d: 日, leap: 是否闰月 }
// 兼容旧数据：'YYYY-MM-DD' 形式的公历生日自动换算成对应农历
function normalizeBirthday(v) {
  if (!v) return null;
  if (typeof v === 'object') {
    const m = Number(v.m);
    const d = Number(v.d);
    if (m >= 1 && m <= 12 && d >= 1 && d <= 30) {
      return { m: m, d: d, leap: !!v.leap };
    }
    return null;
  }
  if (typeof v === 'string') {
    const mt = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (mt) {
      const l = solarToLunar(new Date(Number(mt[1]), Number(mt[2]) - 1, Number(mt[3])));
      if (l) {
        bdAutoConverted = true;
        return { m: l.month, d: l.day, leap: l.isLeap };
      }
    }
  }
  return null;
}

// 生日的中文描述，如：农历八月十五 / 农历闰四月廿九
function birthdayLabel(bd) {
  if (!bd || !bd.m || !bd.d) return '';
  return '农历' + lunarMonthName(bd.m, bd.leap) + lunarDayName(bd.d);
}

// 推算下一次农历生日对应的公历 Date
// 规则：闰月生日在无闰月的年份按同名平月过；三十遇到小月按当月最后一天过
function nextLunarBirthday(bd, fromDate) {
  if (!bd || !bd.m || !bd.d) return null;
  const today = fromDate ? new Date(fromDate.getTime()) : new Date();
  today.setHours(0, 0, 0, 0);
  const lt = solarToLunar(today);
  if (!lt) return null;
  for (let y = lt.year; y <= Math.min(lt.year + 3, 2100); y++) {
    const useLeap = !!bd.leap && lunarLeapMonth(y) === bd.m;
    const dim = useLeap ? lunarLeapDays(y) : lunarMonthDays(y, bd.m);
    if (!dim) continue;
    const day = Math.min(bd.d, dim);
    const s = lunarToSolar(y, bd.m, day, useLeap);
    if (!s) continue;
    const dt = new Date(s.y, s.m - 1, s.d);
    if (dt.getTime() >= today.getTime()) return dt;
  }
  return null;
}
</script>
<script>
'use strict';
/* ================= 数据层（与 Vue 版 store/modules/couple.js 同构） ================= */
const KEY = 'coupleStationData', GH_KEY = 'coupleGithubConfig', SHA_KEY = 'coupleRemoteSha';
const TAGS = ['旅行', '美食', '一起做'];
// 列表型数据字段：buildPayload / importData / hasUserData 统一引用，新增字段只改这里（tags 因需 normalize 单独处理）
const LIST_FIELDS = ['timeline', 'wishes', 'capsules', 'voices', 'customDays', 'periods'];
const QUOTES = ['喜欢是乍见之欢，爱是久处不厌。','我见过很多风景，但都不及你眼里的星光。','愿我们的故事，细水长流，来日方长。','你是我平淡日子里的星辰大海。','世界上有很多美好的词语，但都不如"我们"好听。','往后余生，风雪是你，平淡是你。','和你在一起的每一天，都值得被记住。','爱不是彼此凝视，而是一起望向同一个方向。','慢慢来，我们有一辈子的时间。','想把所有的温柔，都留给你一个人。'];
const MAX_SECONDS = 30;

// 平台检测：安卓默认身份为名字 1，苹果（iOS）默认身份为名字 2
const isAndroid = () => /android/i.test(navigator.userAgent);
const defaultMe = () => isAndroid() ? 1 : 2;
function defaultData() {
  // birthday1 / birthday2 为农历对象：{ m: 月(1-12), d: 日(1-30), leap: 是否闰月 }
  return { name1:'', name2:'', anniversary:'', birthday1:null, birthday2:null, me: defaultMe(),
    timeline:[], wishes:[], capsules:[], voices:[], customDays:[], tags:[], periods:[],
    periodCfg:{ cycle: 28, len: 5 }, lastSyncAt:0, syncError:'' };
}
// 自定义标签统一成对象结构，复用其他数据的「updatedAt + 墓碑」合并逻辑
function normalizeTags(arr) {
  if (!Array.isArray(arr)) return [];
  const seen = new Set();
  const out = [];
  arr.forEach(t => {
    if (typeof t === 'string') t = { id: 'tag:' + t, name: t, deleted: false, updatedAt: 0 };
    if (!t || typeof t.name !== 'string' || !t.name.trim()) return;
    const id = t.id || ('tag:' + t.name);
    if (seen.has(id)) return;
    seen.add(id);
    out.push({ id, name: t.name.trim(), deleted: !!t.deleted, createdAt: t.createdAt || 0, updatedAt: t.updatedAt || 0 });
  });
  return out;
}
let S = (() => { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && typeof d === 'object') return Object.assign(defaultData(), d); } catch (e) {} return defaultData(); })();
// 旧数据兼容：原来的公历生日字符串统一换算为农历对象（bdAutoConverted 会用于设置页提示）
S.birthday1 = normalizeBirthday(S.birthday1);
S.birthday2 = normalizeBirthday(S.birthday2);
// 旧版本标签是字符串数组，这里统一升级为对象（带 id / 删除标记）
S.tags = normalizeTags(S.tags);
/* ---------- 本地缓存层：localStorage 为主 + 无思私有存储镜像备份 ---------- */
const MIRROR_KEY = 'coupleStationCache';
const META_KEY = 'coupleStationMeta';
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
// 私有存储可用性检测（按规范同时校验 getItem / setItem / getAll）
const hasWusiStorage = () => !!(window.wusiStorage
  && typeof window.wusiStorage.getItem === 'function'
  && typeof window.wusiStorage.setItem === 'function'
  && typeof window.wusiStorage.getAll === 'function');
// localStorage 是否有值（读取异常时按「有」处理，避免误覆盖）
const lsHas = (k) => { try { return !!localStorage.getItem(k); } catch (e) { return true; } };
// 本地缓存元信息：是否有改动待上传、最近一次拉取时间、拉取状态
let meta = (() => {
  try {
    const m = JSON.parse(localStorage.getItem(META_KEY));
    return (m && typeof m === 'object') ? m : {};
  } catch (e) { return {}; }
})();
meta.pendingPush = !!meta.pendingPush;
meta.lastPullAt = meta.lastPullAt || 0;
meta.pullState = meta.pullState || 'idle';
let mirrorTimer = null;
let mirrorEnabled = false; // 启动恢复流程结束后才允许写镜像，避免用空数据覆盖备份
// 是否已有真实内容（避免把空白数据写进镜像备份）
function hasUserData() {
  if (S.name1 || S.name2 || S.anniversary || S.birthday1 || S.birthday2) return true;
  return [...LIST_FIELDS, 'tags'].some(k => Array.isArray(S[k]) && S[k].length > 0);
}
function saveMeta() {
  try { localStorage.setItem(META_KEY, JSON.stringify(meta)); }
  catch (e) { console.warn('本地元信息写入失败', e); }

async function ghGet(path) {
  const c = ghCfg();
  const url = ghUrl(c, path) + '?ref=' + (c.branch || '');
  const r = await netFetch(url, { headers: auth(c.token) });
  if (r.status === 404) return { data: null, sha: null };

  const deviceTag = isAndroid() ? 'android' : 'ios';
  const body = { message: `sync from=${deviceTag} me=${S.me} at=${new Date().toISOString()}`, content: isBinary ? content : encB64(JSON.stringify(content, null, 2)), branch: c.branch || undefined };
  if (sha) body.sha = sha;
  const r = await netFetch(ghUrl(c, path), { method: 'PUT', headers: auth(c.token), body: JSON.stringify(body) });

      if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) axis = 'x';

let pendingPhoto = null, uploading = false;
/* ---------- 照片持久缓存：独立 IndexedDB 存 Blob，刷新页面不再重新下载 ---------- */
const PHOTO_DB = 'couplePhotoCache', PHOTO_STORE = 'blobs';
const PHOTO_CACHE_MAX = 60, PHOTO_CACHE_BYTES = 20 * 1024 * 1024; // 双上限：最多 60 张 / 20MB，超出按 savedAt 淘汰最旧
let photoDbPromise = null, photoDbDisabled = false;
function photoDb() {
  if (photoDbPromise) return photoDbPromise;
  if (photoDbDisabled) return Promise.resolve(null);
  photoDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB 不可用')); return; }
    let settled = false;
    const fail = (e) => { if (!settled) { settled = true; reject(e); } };
    // 部分 WebView / 隐私模式下 open 永不回调，1.5s 后放弃，直接走网络
    const timer = setTimeout(() => { photoDbDisabled = true; fail(new Error('IndexedDB 超时')); }, 1500);
    try {
      const req = indexedDB.open(PHOTO_DB, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE);
      };
      req.onsuccess = () => { clearTimeout(timer); if (!settled) { settled = true; resolve(req.result); } };
      req.onerror = () => { clearTimeout(timer); fail(req.error); };
      req.onblocked = () => { clearTimeout(timer); fail(new Error('IndexedDB 被阻塞')); };
    } catch (e) { clearTimeout(timer); fail(e); }
  }).catch(e => { console.warn('照片缓存不可用：', e); return null; });
  return photoDbPromise;
}
async function idbGetPhoto(path) {
  const db = await photoDb(); if (!db) return null;
  return new Promise(res => {
    try {
      const r = db.transaction(PHOTO_STORE, 'readonly').objectStore(PHOTO_STORE).get(path);
      r.onsuccess = () => { const v = r.result; res(v ? (v.blob || v) : null); };
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
async function idbPutPhoto(path, blob) {
  const db = await photoDb(); if (!db) return;
  try { db.transaction(PHOTO_STORE, 'readwrite').objectStore(PHOTO_STORE).put({ blob, savedAt: Date.now() }, path); } catch (e) { /* 忽略配额错误 */ }
}
async function idbDelPhoto(path) {
  const db = await photoDb(); if (!db) return;
  try { db.transaction(PHOTO_STORE, 'readwrite').objectStore(PHOTO_STORE).delete(path); } catch (e) {}
}
// 超限时按 savedAt 淘汰最旧的记录（数量或体积任一超限都触发）
async function trimPhotoCache() {
  const db = await photoDb(); if (!db) return;
  return new Promise(res => {
    try {
      const store = db.transaction(PHOTO_STORE, 'readwrite').objectStore(PHOTO_STORE);
      const all = store.getAll();
      all.onsuccess = () => {
        const items = (all.result || []).map((v, i) => ({ key: store.key(i), savedAt: v.savedAt || 0, size: (v.blob && v.blob.size) || 0 }));
        const total = items.reduce((s, x) => s + x.size, 0);
        if (items.length <= PHOTO_CACHE_MAX && total <= PHOTO_CACHE_BYTES) { res(); return; }
        items.sort((a, b) => a.savedAt - b.savedAt); // 最旧在前
        let n = items.length, bytes = total;
        const victims = [];
        while ((n > PHOTO_CACHE_MAX || bytes > PHOTO_CACHE_BYTES) && victims.length < items.length) {
          const v = items[victims.length];
          victims.push(v.key); n--; bytes -= v.size;
        }
        victims.forEach(k => { try { store.delete(k); } catch (e) { /* 忽略 */ } });
        res();
      };
      all.onerror = () => res();
    } catch (e) { res(); }
  });
}
// 照片内存缓存：路径 → Blob URL（Blob 存 IndexedDB，URL 只存内存，beforeunload 统一释放）
const photoCache = new Map();
function dataUrlToBlob(dataUrl) {
  const str = String(dataUrl || '');
  const comma = str.indexOf(',');
  if (comma < 0) return null;
  const bin = atob(str.slice(comma + 1));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: 'image/jpeg' });
}
// 取照片可显示地址：data: 直用 → 内存 → IndexedDB → 网络（下载后回填两级缓存）
async function getPhotoCached(p) {
  if (!p) return null;
  if (p.startsWith('data:')) return p;
  if (photoCache.has(p)) { // 命中则移到队尾，实现 LRU
    const hit = photoCache.get(p);
    photoCache.delete(p); photoCache.set(p, hit);
    return hit;
  }
  let blob = await idbGetPhoto(p);
  if (!blob) {
    const dataUrl = await ghGetBinary(p, 'image/jpeg').catch(() => null);
    if (!dataUrl) return null; // 失败下次还能重试
    blob = dataUrlToBlob(dataUrl);
    if (blob) { idbPutPhoto(p, blob); trimPhotoCache(); } // 不阻塞显示，后台写入
  }
  if (!blob) return null;
  const url = blobToUrl(blob);
  if (!url) return null;
  photoCache.set(p, url);
  while (photoCache.size > PHOTO_CACHE_MAX) { // 内存层同样限量，淘汰时释放 Blob URL
    const oldest = photoCache.keys().next().value;
    try { URL.revokeObjectURL(photoCache.get(oldest)); } catch (e) { /* 忽略 */ }
    photoCache.delete(oldest);
  }
  return url;
}
// 上传成功后回填缓存：自己刚发的照片不用再从 GitHub 下载一遍
function cachePhotoFromUpload(path, dataUrl) {
  if (!path || !dataUrl) return;
  const blob = dataUrlToBlob(dataUrl);
  if (!blob) return;
  idbPutPhoto(path, blob); trimPhotoCache();
  const url = blobToUrl(blob);
  if (url) photoCache.set(path, url);
}
// 统计照片缓存占用（张数 / MB），供设置页展示
async function photoCacheStats() {
  const db = await photoDb(); if (!db) return null;
  return new Promise(res => {
    try {
      const r = db.transaction(PHOTO_STORE, 'readonly').objectStore(PHOTO_STORE).getAll();
      r.onsuccess = () => {
        const items = r.result || [];
        res({ count: items.length, bytes: items.reduce((s, v) => s + ((v.blob && v.blob.size) || 0), 0) });
      };
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
// 清空照片持久缓存（设置页按钮）
async function clearPhotoCache() {
  const db = await photoDb(); if (!db) { toast('照片缓存不可用'); return; }
  photoCache.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) { /* 忽略 */ } });
  photoCache.clear();
  try { db.transaction(PHOTO_STORE, 'readwrite').objectStore(PHOTO_STORE).clear(); toast('照片缓存已清理 ✨'); } catch (e) { toast('清理失败，请重试'); }
  renderPhotoCacheRow();
}
function hmOf(ts) {

// 时间线日期的人性化显示：今天 / 昨天 / 11-09（月份已由分组头承担）

  if (!ps.length) return (S.periodCfg && S.periodCfg.len) || 5;
  const lens = ps.map(p => Math.max(1, diffDays(p.end, p.start) + 1)).filter(x => x <= 10);
  return lens.length ? Math.round(lens.reduce((s, x) => s + x, 0) / lens.length) : (S.periodCfg && S.periodCfg.len) || 5;
}
// 下次经期预测：最近一次开始日 + 平均周期；长期未记录时按周期推进到未来，避免一直显示过去的日期
function nextPeriod() {
  const ps = validPeriods();
  if (!ps.length) return null;
  const nx = parseDay(ps[0].start);
  const cyc = avgCycle();
  nx.setDate(nx.getDate() + cyc);
  const t = today0();
  while (nx < t) nx.setDate(nx.getDate() + cyc);
  return nx;
}
// 某天的状态：'on' = 经期记录中，'pred' = 预测经期
function dayState(ds) {
  for (const p of validPeriods()) {
    if (ds >= p.start && (!p.end || ds <= p.end)) return 'on';
  }
  const nx = nextPeriod();
  if (nx) {
    for (let k = 0; k < avgLen(); k++) {
      const d = addDays(nx, k);
      if (fmtDay(d) === ds) return 'pred';
    }
  }
  return '';
}
function addPeriod() {
  const start = $('perStart').value;
  if (!start) { toast('先选择开始日期'); return; }
  const end = $('perEnd').value;
  if (end && end < start) { toast('结束日期不能早于开始日期'); return; }
  addListItem('periods', { id: uid(), start, end: end || '' });
  $('perStart').value = ''; $('perEnd').value = '';
  toast('已记录 🌹');
}
const delPeriod = (id) => confirmDel('确定删除这条经期记录吗？', 'periods', id);
function calShift(n) { calM += n; if (calM < 0) { calM = 11; calY--; } else if (calM > 11) { calM = 0; calY++; } renderCalendar(); }
function renderCalendar() {
  $('calYm').textContent = `${calY}年${calM + 1}月`;
  const startWd = new Date(calY, calM, 1).getDay();
  const days = new Date(calY, calM + 1, 0).getDate();
  const today = fmtDay(new Date());
  let html = ['日','一','二','三','四','五','六'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < startWd; i++) html += '<div class="cal-cell dim"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${calY}-${pad(calM + 1)}-${pad(d)}`;
    const st = dayState(ds);
    html += `<div class="cal-cell${st ? ' ' + st : ''}${ds === today ? ' today' : ''}">${d}</div>`;
  }
  $('calGrid').innerHTML = html;
}
function renderPeriods() {
  renderCalendar();
  const ps = validPeriods();
  const today = fmtDay(new Date());
  const st = dayState(today);
  let head = '还没有经期记录', sub = '记录一次经期的开始/结束日期，就会自动计算周期并预测下次经期';
  if (st === 'on') {
    const p = ps.find(x => today >= x.start && (!x.end || today <= x.end));
    const dayN = diffDays(today, p.start) + 1;
    head = `🌹 经期第 ${dayN} 天`;
    sub = p.end ? `本次记录到 ${p.end} 结束 · 多喝热水，好好休息` : '结束后记得补填结束日期，预测会更准 💕';
  } else if (ps.length) {
    const nx = nextPeriod();
    const days = daysTo(nx);
    head = days > 0 ? `距下次经期约 ${days} 天` : '下次经期预计就在这几天';
    sub = `预计 ${fmtDay(nx)} 前后开始 · 平均周期 ${avgCycle()} 天 · 经期约 ${avgLen()} 天`;
  }
  $('perPred').innerHTML = `<div class="big">${esc(head)}</div><div class="sub">${esc(sub)}</div>`;
  $('perList').innerHTML = ps.length ? ps.map(p => {
    const len = p.end ? diffDays(p.end, p.start) + 1 : 0;
    return `<div class="period-item"><div class="info"><div class="range">${esc(p.start)}${p.end ? ' ~ ' + esc(p.end) : ' · 进行中'}</div><div class="sub">${len ? `共 ${len} 天` : '尚未填写结束日期'} · 记录于 ${fmtTs(p.createdAt)}</div></div><button class="btn danger" onclick="delPeriod('${p.id}')">删除</button></div>`;
  }).join('') : '<div class="empty">还没有经期记录<br>在上面填入开始日期开始记录吧 🌹</div>';
}

/* ================= 设置 ================= */
/* ---- 「我们是谁」模块已移除：名字/纪念日/生日沿用已保存数据，不再提供编辑界面 ---- */
/* ---- GitHub 配置卡片已移除：使用硬编码 DEFAULT_GH，不再提供编辑界面 ---- */
function renderSettings() {
  renderSyncState(); renderDayList(); renderPhotoCacheRow();
}
// 设置页「照片缓存」行：张数 / 占用（IndexedDB 不可用时显示不可用）
async function renderPhotoCacheRow() {
  const el = $('photoCacheInfo'); if (!el) return;
  const st = await photoCacheStats();
  el.textContent = st ? `${st.count} 张 · ${(st.bytes / 1024 / 1024).toFixed(1)} MB` : '不可用（仅内存缓存）';
}
function renderSyncState() {
  const el = $('syncState'); if (!el) return;
  if (S.syncError) { el.textContent = '同步异常：' + S.syncError; return; }
  const parts = [];
  if (S.lastSyncAt) parts.push('上次上传：' + new Date(S.lastSyncAt).toLocaleString());
  if (meta.lastPullAt) parts.push('上次拉取：' + new Date(meta.lastPullAt).toLocaleString());
  el.textContent = parts.length ? parts.join(' · ') : '已配置，等待首次同步';
}

/* ================= 本地缓存状态展示 ================= */
// 时间戳 → 「今天 10:24 / 3月9日 10:24」
// 注意：此函数在启动早期就会被调用，不能依赖 $ / pad 常量（可能尚未初始化）
function fmtTimeShort(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '—';
  const p2 = (n) => String(n).padStart(2, '0');
  const hm = `${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const now = new Date();
  return d.toDateString() === now.toDateString() ? `今天 ${hm}` : `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
}
// 统计有效条目（过滤墓碑）
function countValid(key) {
  return (S[key] || []).filter(x => x && !x.deleted).length;
}
// 刷新「本地数据」卡片（元素不存在时直接跳过）
function refreshCacheUI() {
  const saved = document.getElementById('cacheSavedAt');
  if (!saved) return;
  saved.textContent = fmtTimeShort(S.localSavedAt);
  const pulled = document.getElementById('cachePulledAt');
  if (pulled) pulled.textContent = fmtTimeShort(meta.lastPullAt);
  const counts = document.getElementById('cacheCounts');
  if (counts) counts.textContent = `时间线 ${countValid('timeline')} · 心愿 ${countValid('wishes')} · 胶囊 ${countValid('capsules')} · 语音 ${countValid('voices')} · 经期 ${countValid('periods')}`;
  const st = document.getElementById('cacheState');
  if (!st) return;
  let text = '本地数据已就绪';
  let cls = 'ok';
  if (meta.pullState === 'pulling') { text = '正在拉取云端最新的…'; cls = 'busy'; }
  else if (meta.pullState === 'error') { text = '离线，正在使用本地数据'; cls = 'warn'; }
  else if (meta.pendingPush) { text = '有本机改动待上传'; cls = 'warn'; }
  else if (meta.pullState === 'ok') { text = '已同步到最新'; cls = 'ok'; }
  else if (meta.pullState === 'local') { text = '仅本机保存'; cls = 'idle'; }
  st.textContent = text;
  st.className = 'cache-badge ' + cls;
}
function renderDayList() {
  const list = S.customDays.filter(d => !d.deleted);
  $('dayList').innerHTML = list.length
    ? list.map(d => `<div class="day-item"><span>📅 ${esc(d.name)}</span><span class="d">${esc(d.date)}</span><button class="btn danger" onclick="removeDay('${d.id}')">删除</button></div>`).join('')
    : '<div class="empty">还没有自定义纪念日</div>';
}
function addDay() {
  const name = $('dayName').value.trim();
  if (!name) { toast('先写个日子名称吧～'); return; }
  if (!$('dayDate').value) { toast('请选择日期'); return; }
  addListItem('customDays', { id: uid(), name, date: $('dayDate').value });
  $('dayName').value = ''; toast('已添加 📅');
}
const removeDay = (id) => confirmDel('确定删除这个纪念日吗？', 'customDays', id);
async function pullGh() {
  toast('拉取中…');
  const r = await pullLatest({ silent: false });
  if (r.ok && r.empty) toast('远端还没有数据，先上传吧');
}
async function pushGh() {
  toast('上传中…');
  clearTimeout(syncTimer);
  const ok = await flushPush();
  toast(ok ? '上传成功，已同步到 GitHub ☁️' : '上传失败，请检查网络或配置 ❌');
}
/* ================= 路由 & 渲染 ================= */
function go(p, btn, dir) {
  const target = $('page-' + p);
  // 同时清掉滑动跟手留下的内联 transform/transition，避免残留影响下次入场动画
  document.querySelectorAll('.page').forEach(el => { el.classList.remove('active', 'anim-l', 'anim-r'); el.style.transform = ''; el.style.transition = ''; });
  target.classList.add('active');
  if (dir) target.classList.add(dir === 'l' ? 'anim-l' : 'anim-r');
  if (!btn) btn = document.querySelector('nav.tabbar button[data-p="' + p + '"]');
  document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  window.scrollTo(0, 0);
  if (p === 'home') { syncCountHeight(); setTimeout(syncCountHeight, 60); } // 切回首页时补量高度（隐藏时量不到；rAF 在部分 WebView 会被节流，用直接调用+短延时兜底）
  if (p === 'voice') { renderVoices(); scheduleVoicePrefetch(300); } // 进页面就先偷偷把最近几条下载好
  if (p === 'period') renderPeriods(); // 进经期页刷新日历与预测（跨月停留后数据可能已更新）
}
/* ===== 左右滑动切换页面 ===== */
// 与底部导航同序（从 DOM 生成，新增页签无需改这里）；滑动只发生在「非输入控件、非纪念日翻页区」上，且横向位移明显大于纵向
const TAB_ORDER = [...document.querySelectorAll('nav.tabbar button')].map(b => b.dataset.p);
onSwipe(document.querySelector('main'), {
  min: 60, ratio: 1.4, flick: 30,
  guard: e => e.target.closest('#countPager, input, textarea, select, button'),
  // 跟手拖拽：当前页随手势平移（0.55 阻尼；首/末页往外拖只剩 0.25，暗示到边了）
  onMove: dx => {
    const cur = document.querySelector('.page.active');
    if (!cur) return;
    const idx = TAB_ORDER.indexOf(cur.id.replace('page-', ''));
    const edge = (idx <= 0 && dx > 0) || (idx >= TAB_ORDER.length - 1 && dx < 0);
    cur.style.transition = 'none';
    cur.style.transform = `translateX(${Math.round(dx * (edge ? 0.25 : 0.55))}px)`;
  },
  // 松手未达切换阈值时弹回原位（切页时 go() 会直接清掉内联样式，不冲突）
  onEnd: () => {
    const cur = document.querySelector('.page.active');
    if (!cur || !cur.style.transform) return;
    cur.style.transition = 'transform .22s ease';
    cur.style.transform = '';
    setTimeout(() => { cur.style.transition = ''; }, 240);
  }
}, dx => {
  const cur = document.querySelector('.page.active');
  const idx = cur ? TAB_ORDER.indexOf(cur.id.replace('page-', '')) : -1;
  if (idx < 0) return;
  const next = idx + (dx < 0 ? 1 : -1);
  if (next >= 0 && next < TAB_ORDER.length) go(TAB_ORDER[next], null, dx < 0 ? 'l' : 'r');
});

function renderAll() {
  renderHome(); renderTimeline(); renderWishes(); renderCapsules(); renderVoices(); renderPeriods(); renderSettings();
  refreshCacheUI(); // 数据一变就同步刷新「本地缓存」卡片
}

$('tlPhoto').addEventListener('change', onPhotoChange);
$('tlSearch').addEventListener('input', renderTimeline);
$('tlText').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addTimeline(); } });
$('wishText').addEventListener('keydown', e => { if (e.key === 'Enter') addWish(); });
$('tagInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmAddTag(); } });
$('capText').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.ctrlKey) { e.preventDefault(); addCapsule(); } });
$('dayName').addEventListener('keydown', e => { if (e.key === 'Enter') addDay(); });

// 默认时间线日期 = 今天；录音提示文案与 MAX_SECONDS 保持单一来源；语音播放器事件只需绑定一次
(() => { $('tlDate').value = fmtDay(new Date()); $('recTip').textContent = `点击开始录音，最长 ${MAX_SECONDS} 秒`; })();
bindVoicePlayer();
renderAll();
boot().catch(err => console.error('启动同步流程异常：', err));
</script>
